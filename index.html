<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR 商業提案測試</title>
    <!-- 載入 Google 開源模組 -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background-color: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; }
        model-viewer { width: 100%; height: 100%; }
        /* 幫妳寫了一個比較有質感的黑色按鈕 */
        .ar-btn { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); padding: 15px 30px; font-size: 18px; border-radius: 8px; border: none; background-color: #000; color: #fff; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

    <!-- 直接連線到 Google 的測試模型，自動判定雙平台 -->
    <model-viewer 
        src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 
        ios-src="https://modelviewer.dev/shared-assets/models/Astronaut.usdz" 
        ar 
        camera-controls 
        auto-rotate>
        
        <button slot="ar-button" class="ar-btn">
            🚀 召喚太空人 AR
        </button>
        
    </model-viewer>

</body>
</html>
