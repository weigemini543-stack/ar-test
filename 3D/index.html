<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR 雙模式傳送門</title>
  
  <!-- 引入 model-viewer (用於 3D 預覽與平面追蹤) -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  
  <!-- 引入 A-Frame 與 MindAR (用於圖片追蹤) -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: 'PingFang TC', '微軟正黑體', sans-serif;
      background-color: #f5f5f5;
    }

    /* 首頁介面排版 */
    #home-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      width: 100vw;
      box-sizing: border-box;
    }

    /* 上半部：3D 模型預覽區 */
    model-viewer {
      width: 100%;
      height: 70vh; 
      background-color: #f5f5f5;
    }

    /* 下半部：按鈕區塊 */
    .button-container {
      display: flex;
      flex-direction: column; /* 按鈕上下排列 */
      gap: 15px;
      margin-top: 10px;
      width: 85%;
      max-width: 300px;
    }

    .ar-btn {
      background-color: #111;
      color: white;
      border: none;
      padding: 15px 20px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    /* 圖片掃描模式的容器 (初始為隱藏) */
    #mindar-container {
      display: none;
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1000;
    }
    
    /* 返回首頁按鈕 */
    #back-btn {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1001;
      background-color: rgba(0,0,0,0.7);
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      border: 1px solid white;
      font-size: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- ==============================
       第一層：首頁預覽與選單 
       ============================== -->
  <div id="home-screen">
    
    <!-- 預覽模型兼具「平面追蹤」發射器 -->
    <model-viewer 
      id="preview-model"
      src="untitled.glb" 
      scale="0.1 0.1 0.1" 
      camera-controls 
      auto-rotate
      ar
      ar-modes="webxr scene-viewer quick-look">
      
      <!-- 隱藏原本預設的右下角小按鈕，由我們自己設計的按鈕接管 -->
      <button slot="ar-button" style="display: none;"></button>
    </model-viewer>

    <!-- 我們的專屬雙按鈕 -->
    <div class="button-container">
      <button class="ar-btn" onclick="startPlaneAR()">
        📦 放置桌面 (自由縮放)
      </button>
      
      <button class="ar-btn" onclick="startImageAR()">
        🃏 掃描酷卡 (圖片追蹤)
      </button>
    </div>
  </div>


  <!-- ==============================
       第二層：圖片掃描追蹤模式
       ============================== -->
  <div id="mindar-container">
    <button id="back-btn" onclick="stopImageAR()">❌ 結束掃描返回</button>
  </div>

  <script>
    // 按鈕 A：觸發平面 AR (直接呼叫 model-viewer 的內建功能)
    function startPlaneAR() {
      const modelViewer = document.getElementById('preview-model');
      modelViewer.activateAR();
    }

    // 按鈕 B：觸發圖片掃描 AR (隱藏首頁，動態載入 MindAR 相機)
    function startImageAR() {
      document.getElementById('home-screen').style.display = 'none';
      const mindarContainer = document.getElementById('mindar-container');
      mindarContainer.style.display = 'block';

      // 讀取 targets.mind 與 untitled.glb
      mindarContainer.innerHTML += `
        <a-scene mindar-image="imageTargetSrc: targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
          <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
          <a-entity mindar-image-target="targetIndex: 0">
            <a-gltf-model rotation="0 0 0" position="0 0 0" scale="0.1 0.1 0.1" src="untitled.glb"></a-gltf-model>
          </a-entity>
        </a-scene>
      `;
    }

    // 退出圖片掃描 (重新整理網頁，最乾淨地關閉相機釋放記憶體)
    function stopImageAR() {
      location.reload();
    }
  </script>
</body>
</html>
